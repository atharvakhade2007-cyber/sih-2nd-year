{% extends "core/base.html" %}
{% block title %}Register — KaamConnect{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-brand-900 via-brand-800 to-slate-900 flex items-center justify-center p-4 py-12">
  <div class="w-full max-w-lg animate-slide-up">

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">

      <!-- Header -->
      <div class="gradient-brand px-8 py-7 text-center">
        <h1 class="text-2xl font-bold text-white">Create Customer Account</h1>
        <p class="text-brand-200 text-sm mt-1">Book household services in minutes</p>
      </div>

      <!-- Form -->
      <div class="px-8 py-8">
        <form method="post" action="{% url 'core:register' %}" class="space-y-4" id="register-form">
          {% csrf_token %}

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1.5">First Name</label>
              <input type="text" name="first_name" value="{{ post_data.first_name|default:'' }}"
                     class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-400 text-sm" placeholder="Rahul" />
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1.5">Last Name</label>
              <input type="text" name="last_name" value="{{ post_data.last_name|default:'' }}"
                     class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-400 text-sm" placeholder="Sharma" />
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Username <span class="text-red-500">*</span></label>
            <input type="text" name="username" value="{{ post_data.username|default:'' }}" required
                   class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-400 text-sm" placeholder="rahul_sharma" />
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Email Address <span class="text-red-500">*</span></label>
            <input type="email" name="email" value="{{ post_data.email|default:'' }}" required
                   class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-400 text-sm" placeholder="rahul@example.com" />
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1.5">Phone Number</label>
              <input type="tel" name="phone_number" value="{{ post_data.phone_number|default:'' }}"
                     class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-400 text-sm" placeholder="+91 98765 43210" />
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1.5">City</label>
              <input type="text" name="city" value="{{ post_data.city|default:'' }}"
                     class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-400 text-sm" placeholder="Mumbai" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1.5">PIN Code</label>
              <input type="text" name="pincode" value="{{ post_data.pincode|default:'' }}"
                     class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-400 text-sm" placeholder="400001" />
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                Location
                <button type="button" id="detect-location-btn"
                        class="ml-1 text-xs text-brand-600 hover:text-brand-700 font-normal underline">
                  Auto-detect
                </button>
              </label>
              <input type="text" id="location-display" readonly placeholder="Click auto-detect"
                     class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-100 text-slate-500 text-xs cursor-not-allowed" />
              <input type="hidden" name="latitude" id="lat-input" />
              <input type="hidden" name="longitude" id="lon-input" />
            </div>
          </div>

          <div x-data="{ show: false }">
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Password <span class="text-red-500">*</span></label>
            <div class="relative">
              <input :type="show ? 'text' : 'password'" name="password1" required
                     class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-400 text-sm pr-10" placeholder="Min. 8 characters" />
              <button type="button" @click="show = !show" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              </button>
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Confirm Password <span class="text-red-500">*</span></label>
            <input type="password" name="password2" required
                   class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-400 text-sm" placeholder="Re-enter password" />
          </div>

          <button type="submit" id="register-submit-btn"
                  class="w-full gradient-brand text-white font-semibold py-3 rounded-xl shadow-md hover:shadow-lg hover:opacity-90 transition-all text-sm mt-2">
            Create Account
          </button>
        </form>

        <p class="text-center text-sm text-slate-500 mt-5">
          Already have an account?
          <a href="{% url 'core:login' %}" class="text-brand-600 font-semibold hover:text-brand-700">Sign In</a>
        </p>
        <p class="text-center text-sm text-slate-500 mt-1">
          Want to work with us?
          <a href="{% url 'core:worker_register' %}" class="text-accent-500 font-semibold hover:text-accent-600">Register as Worker →</a>
        </p>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('detect-location-btn').addEventListener('click', function() {
    if (!navigator.geolocation) {
      alert('Geolocation not supported by your browser.');
      return;
    }
    this.textContent = 'Detecting...';
    navigator.geolocation.getCurrentPosition(pos => {
      document.getElementById('lat-input').value = pos.coords.latitude.toFixed(6);
      document.getElementById('lon-input').value = pos.coords.longitude.toFixed(6);
      document.getElementById('location-display').value = pos.coords.latitude.toFixed(4) + ', ' + pos.coords.longitude.toFixed(4);
      this.textContent = '✓ Detected';
    }, () => {
      this.textContent = 'Auto-detect';
      alert('Could not detect location. Please enter manually if needed.');
    });
  });
</script>
{% endblock %}
