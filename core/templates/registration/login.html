{% extends "core/base.html" %}

{% block title %}Log In - KaamConnect{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-3xl border border-slate-200 shadow-xl">
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-gradient-to-tr from-brand-600 to-emerald-400 text-white font-bold text-2xl rounded-2xl flex items-center justify-center mx-auto shadow-md shadow-brand-500/20">
                <i class="fa-solid fa-right-to-bracket"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-slate-900">Welcome Back</h2>
            <p class="text-xs text-slate-500">Log in to your KaamConnect cooperative account</p>
        </div>

        {% if form.errors %}
            <div class="p-4 bg-rose-50 border border-rose-200 rounded-xl text-xs font-semibold text-rose-800 flex items-center space-x-2">
                <i class="fa-solid fa-circle-exclamation text-rose-500"></i>
                <span>Invalid username or password. Please try again.</span>
            </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}" class="space-y-6">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div>
                <label for="id_username" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Username or Email</label>
                <input type="text" name="username" id="id_username" required class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all">
            </div>

            <div>
                <label for="id_password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Password</label>
                <input type="password" name="password" id="id_password" required class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all">
            </div>

            <button type="submit" class="w-full py-3.5 px-4 bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-brand-600/30 transition-all hover:scale-[1.01] focus:outline-none">
                Log In to KaamConnect
            </button>
        </form>
    </div>
</div>
{% endblock %}
